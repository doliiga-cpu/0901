<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="사이드노트 로그인"><title>로그인 | SIDE NOTE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-shell"><section class="auth-visual"><a class="logo" href="index.html">SIDE NOTE<span>.</span></a><div class="auth-quote"><p>“기록은 흩어진 생각에<br>자리를 만들어주는 일.”</p><span>오늘의 생각을 다시 만나보세요.</span></div></section><section class="auth-panel"><div class="auth-box reveal"><p class="eyebrow">WELCOME BACK</p><h1>다시 만나 반가워요.</h1><p class="intro">이메일과 비밀번호를 입력해 로그인하세요.</p><form class="form-stack" id="login-form"><div class="field"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div><div class="field"><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" placeholder="8자 이상 입력" minlength="8" autocomplete="current-password" required></div><div class="checkbox-row"><input id="remember" name="remember" type="checkbox"><label for="remember">로그인 상태 유지</label></div><button class="submit-button" type="submit">로그인</button><p class="form-message" aria-live="polite"></p></form><p class="auth-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p><p class="auth-switch"><a href="index.html">← 블로그로 돌아가기</a></p></div></section></main><script src="config.js"></script><script src="script.js"></script><script src="auth.js"></script></body></html>
