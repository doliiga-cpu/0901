<body><header class="header"><nav class="nav container" aria-label="주요 메뉴"><a class="logo" href="index.html">SIDE NOTE<span>.</span></a><button class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button><div class="nav-links"><a href="index.html">글</a><a href="profile.html">프로필</a><a href="write.html" aria-current="page">새 글 작성</a></div><div class="nav-actions"><button class="icon-button" type="button" aria-label="다크 모드로 전환">☾</button><a class="nav-login" href="login.html">로그아웃</a></div></nav></header>
<main class="page-main"><section class="page-title"><div class="container reveal"><p class="eyebrow">NEW STORY</p><h1>새로운 이야기</h1><p>오늘 발견한 생각을 당신의 언어로 남겨보세요.</p></div></section><form class="editor-layout container reveal" data-demo-form data-success-message="게시글이 발행되었습니다. (데모 화면)"><section class="editor-main"><label class="field-label" for="post-title">제목</label><input class="editor-title" id="post-title" type="text" placeholder="제목을 입력하세요" required><label class="field-label" for="post-content">본문</label><textarea class="editor-content" id="post-content" placeholder="당신의 이야기를 들려주세요.&#10;&#10;문단을 나누면 글을 더 편하게 읽을 수 있어요." required></textarea></section><aside class="editor-side"><div class="editor-card"><h3>게시글 설정</h3><div class="field"><label for="post-category">카테고리</label><select id="post-category" required><option value="">선택하세요</option><option>기술</option><option>디자인</option><option>일상</option><option>생각</option></select></div><div class="field"><label for="post-tags">태그</label><input id="post-tags" type="text" placeholder="기록, 생각, 일상"></div><div class="field"><label for="post-summary">한 줄 소개</label><textarea id="post-summary" placeholder="글 목록에 표시될 설명"></textarea></div></div><div class="editor-card"><h3>공개 설정</h3><label class="checkbox-row"><input type="radio" name="visibility" checked> 전체 공개</label><label class="checkbox-row"><input type="radio" name="visibility"> 비공개</label></div><div class="publish-actions"><button class="submit-button" type="submit">게시글 발행</button><button class="outline-button" type="button" data-draft>임시 저장</button><p class="form-message" aria-live="polite"></p></div></aside></form></main>
