<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="사이드노트 회원가입"><title>회원가입 | SIDE NOTE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-shell"><section class="auth-visual"><a class="logo" href="index.html">SIDE NOTE<span>.</span></a><div class="auth-quote"><p>당신만의 이야기를<br>오늘부터 시작하세요.</p><span>생각을 쓰고, 사람들과 나누는 공간.</span></div></section><section class="auth-panel"><div class="auth-box reveal"><p class="eyebrow">JOIN SIDE NOTE</p><h1>회원가입</h1><p class="intro">기록을 시작하는 데 필요한 건 작은 계정 하나뿐이에요.</p><form class="form-stack" data-demo-form data-success-message="가입 신청이 완료되었습니다. (데모 화면)"><div class="field-row"><div class="field"><label for="signup-name">이름</label><input id="signup-name" type="text" placeholder="홍길동" autocomplete="name" required></div><div class="field"><label for="signup-handle">사용자 이름</label><input id="signup-handle" type="text" placeholder="gildong" pattern="[A-Za-z0-9_]+" required></div></div><div class="field"><label for="signup-email">이메일</label><input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" required></div><div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" type="password" placeholder="영문, 숫자 포함 8자 이상" minlength="8" autocomplete="new-password" required></div><div class="checkbox-row"><input id="terms" type="checkbox" required><label for="terms">이용약관 및 개인정보 처리방침에 동의합니다.</label></div><button class="submit-button" type="submit">계정 만들기</button><p class="form-message" aria-live="polite"></p></form><p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p></div></section></main><script src="script.js"></script></body></html>
